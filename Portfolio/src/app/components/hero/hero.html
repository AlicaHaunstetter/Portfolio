<section class="hero-wrapper">
  <div class="hero-row">
    <svg
      class="hero-wave"
      viewBox="0 0 1440 1079"
      preserveAspectRatio="none"
      fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M1440
        0L1440
        1079L0
        1079L-2
        421.5C234
        441.5
        351.4
        434.372
        567.5
        385C982
        290.3
        1279.7
        152.1
        1440
        0Z"
        fill="url(#paint0_radial_11_221)"
      />
      <defs>
        <radialGradient
          id="paint0_radial_11_221"
          cx="0"
          cy="0"
          r="1"
          gradientUnits="userSpaceOnUse"
          gradientTransform="translate(672 42.5) rotate(82.2154) scale(887.756 1492.19)"
        >
          <stop offset="0.00372417" stop-color="#1A2743" />
          <stop offset="0.135417" stop-color="#27334B" />
          <stop offset="0.719125" stop-color="#141D2F" />
        </radialGradient>
      </defs>
    </svg>

    <div class="hero-row__inner content-wrapper">
      <div class="profile-picture">
        <app-blob
          variant="wild"
          color="purple"
          [seed]="3"
          class="profile-picture__blob profile-picture__blob--purple"
        />
        <app-blob
          variant="wild"
          color="green"
          [seed]="8"
          [duration]="20"
          class="profile-picture__blob profile-picture__blob--green"
        />
        <img src="/img/Profilbild-Alica.png" [alt]="'hero.portraitAlt' | translate" />
      </div>
      <div class="hero-content">
        <div class="hero-text">
          <div class="text-left">I am</div>
          <div class="text-right">
            <div class="text-right-first-line">Alica Haunstetter</div>
            <div class="text-right-second-line">FRONTEND DEVELOPER</div>
          </div>
        </div>

        <a href="#contact" class="btn">Let's talk</a>
      </div>

      <div class="social-row">
        <span class="social-row__line"></span>

        <a
          href="https://github.com/AlicaHaunstetter"
          target="_blank"
          rel="noopener noreferrer"
          class="social-row__icon"
          aria-label="GitHub"
        >
          <img src="/icons/social/github.svg" alt="" />
        </a>

        <a href="mailto:info@alica-haunstetter.de" class="social-row__icon" aria-label="E-Mail">
          <img src="/icons/social/mail.svg" alt="" />
        </a>

        <a
          href="https://www.linkedin.com/in/alica-haunstetter/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-row__icon"
          aria-label="LinkedIn"
        >
          <img src="/icons/social/linkedin.svg" alt="" />
        </a>

        <a class="social-row__email" href="mailto:info@alica-haunstetter.de"
          >info@alica-haunstetter.de</a
        >
      </div>

      <div class="scroll-down">
        <span>{{ 'hero.scrollDown' | translate }}</span>
        <svg
          width="15"
          height="16"
          viewBox="0 0 15 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M8.36382 12.172L13.0208 7.515C13.4113 7.12453 14.0444 7.12453 14.4348 7.515C14.8253 7.90547 14.8253 8.53854 14.4348 8.929L8.07092 15.2929C7.6804 15.6834 7.04723 15.6834 6.65671 15.2929L0.292815 8.929C-0.0976501 8.53853 -0.09765 7.90547 0.292815 7.515C0.683281 7.12453 1.31635 7.12453 1.70682 7.515L6.36382 12.172V1C6.36382 0.447715 6.81153 0 7.36382 0C7.9161 0 8.36382 0.447715 8.36382 1V12.172Z"
            fill="white"
          />
        </svg>
      </div>
    </div>
  </div>
</section>

<header class="navbar">
  <div class="navbar__inner content-wrapper">
    <a routerLink="/" fragment="top" class="navbar__logo">
      <img src="/icons/Alica-Logo.png" [alt]="'nav.logoAlt' | translate" class="navbar__logo-img" />
    </a>

    <nav class="navbar__links">
      <a routerLink="/" fragment="about-me">{{ 'nav.aboutMe' | translate }}</a>
      <a routerLink="/" fragment="skills">{{ 'nav.skills' | translate }}</a>
      <a routerLink="/" fragment="portfolio">{{ 'nav.portfolio' | translate }}</a>
      <a routerLink="/" fragment="contact">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="navbar__lang">
      <button
        type="button"
        class="navbar__lang-btn"
        [class.navbar__lang-btn--active]="currentLang() === 'de'"
        (click)="setLang('de')"
      >
        DE
      </button>
      <button
        type="button"
        class="navbar__lang-btn"
        [class.navbar__lang-btn--active]="currentLang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <button
      type="button"
      class="navbar__burger"
      [class.navbar__burger--active]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-label]="'nav.openMenu' | translate"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

@if (isMenuOpen()) {
  <div class="navbar__overlay">
    <nav class="navbar__overlay-links">
      <a routerLink="/" fragment="about-me" (click)="closeMenu()">{{ 'nav.aboutMe' | translate }}</a>
      <a routerLink="/" fragment="skills" (click)="closeMenu()">{{ 'nav.mySkills' | translate }}</a>
      <a routerLink="/" fragment="portfolio" (click)="closeMenu()">{{ 'nav.portfolio' | translate }}</a>
      <a routerLink="/" fragment="contact" (click)="closeMenu()">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="navbar__overlay-lang">
      <button type="button" [class.active]="currentLang() === 'en'" (click)="setLang('en')">
        EN
      </button>
      <span>/</span>
      <button type="button" [class.active]="currentLang() === 'de'" (click)="setLang('de')">
        DE
      </button>
    </div>
  </div>
}

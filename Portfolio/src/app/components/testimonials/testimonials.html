<section class="testimonials">
  <app-blob color="green" [seed]="34" [duration]="17" class="testimonials__blob" />
  <div class="testimonials__content content-wrapper">
    <div class="testimonials__slide">
      <article class="testimonials__card" aria-live="polite">
        <span class="testimonials__quote" aria-hidden="true"></span>
        <p class="testimonials__text">{{ current().text | translate }}</p>
        <div class="testimonials__author">
          <span class="testimonials__line"></span>
          <span>{{ current().author }} - {{ current().role | translate }}</span>
        </div>
      </article>

      <div class="testimonials__photo">
        <img [src]="current().image" [alt]="current().author" />
      </div>
    </div>

    <nav class="testimonials__nav" [attr.aria-label]="'testimonials.navLabel' | translate">
      <button
        type="button"
        class="testimonials__arrow"
        (click)="prev()"
        [attr.aria-label]="'testimonials.prev' | translate"
      >
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>

      @for (t of testimonials; track t.author; let i = $index) {
        <button
          type="button"
          class="testimonials__dot"
          [class.testimonials__dot--active]="i === currentIndex()"
          [attr.aria-current]="i === currentIndex()"
          [attr.aria-label]="'testimonials.show' | translate: { number: i + 1 }"
          (click)="goTo(i)"
        ></button>
      }

      <button
        type="button"
        class="testimonials__arrow"
        (click)="next()"
        [attr.aria-label]="'testimonials.next' | translate"
      >
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </button>
    </nav>
  </div>
</section>
